<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ez-logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GrocerEZ - Compare Grocery Prices</title>
    <meta name="description" content="Snap a grocery price tag and compare prices other shoppers found at the stores near you. Now in Dallas–Fort Worth." />
    <link rel="canonical" href="https://grocerez.app/" />

    <!-- Installable web app ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16A34A" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GrocerEZ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews (Facebook, Nextdoor, iMessage, Slack, Discord, X, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GrocerEZ" />
    <meta property="og:url" content="https://grocerez.app/" />
    <meta property="og:title" content="GrocerEZ - Compare grocery prices near you" />
    <meta property="og:description" content="Snap a price tag, share it, and compare prices other shoppers found. Now in Dallas–Fort Worth." />
    <meta property="og:image" content="https://grocerez.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GrocerEZ: see what groceries cost at the stores near you." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GrocerEZ - Compare grocery prices near you" />
    <meta name="twitter:description" content="Snap a price tag, share it, and compare prices other shoppers found. Now in Dallas–Fort Worth." />
    <meta name="twitter:image" content="https://grocerez.app/og-image.png" />
    <!-- Import Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }
      
      #root {
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        overflow: hidden;
      }
      
      /* Prevent blue highlight on tap (mobile) */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Camera access styles */
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      
      canvas {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
