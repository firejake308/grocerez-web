# VPS deployment: sync API + self-hosted Overpass + Caddy for automatic
# HTTPS, all in one Compose stack on a single droplet. See
# docs/server-sync-plan.md section 13 and this repo's server/README.md
# ("Deploying to a VPS") for the full walkthrough.
#
# Quick start:
#   cp .env.example .env                    # fill in real values
#   ./deploy/fetch-overpass-extract.sh       # downloads + clips a regional extract
#   # edit Caddyfile: replace the placeholder domain with your own
#   docker compose up -d

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    volumes:
      # The api container runs as the non-root "node" user (uid 1000); make
      # sure ./data is writable by that uid before first `docker compose up`
      # -- see server/README.md ("Deploying to a VPS").
      - ./data:/data
    environment:
      DATABASE_PATH: /data/grocerez.db
      PORT: '8787'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      NETLIFY_SITE_SLUG: ${NETLIFY_SITE_SLUG}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      OVERPASS_URL: ${OVERPASS_URL:-http://overpass:80/api/interpreter}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      ENTITLEMENTS_ENFORCED: ${ENTITLEMENTS_ENFORCED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_CENTS_PER_1K_TOKENS: ${OPENROUTER_CENTS_PER_1K_TOKENS:-0.2}
      PARSE_DAILY_BUDGET_CENTS: ${PARSE_DAILY_BUDGET_CENTS:-500}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      APP_URL: ${APP_URL:-http://localhost:5173}
      PHOTO_DIR: /data/photos
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8787/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    # No host port published -- Caddy is the only thing that talks to the
    # API from outside the compose network. Add "ports: ['8787:8787']"
    # back temporarily if you need to curl it directly while debugging.

  # On-demand development API (profile "dev": it does not exist unless asked
  # for). Same image as `api`, but its own SQLite file, admin token, Stripe
  # TEST keys, and emailless sign-in (codes print in its logs). Deploy previews
  # and branch deploys point here, so they never touch production data or live
  # Stripe. All settings come from DEV_* variables in .env.
  #   start:  docker compose --profile dev up -d api-dev
  #   stop:   docker compose stop api-dev
  # See server/README.md ("Dev API on the VPS").
  api-dev:
    profiles: ['dev']
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    volumes:
      - ./data-dev:/data
    environment:
      DATABASE_PATH: /data/grocerez.db
      PORT: '8787'
      CORS_ORIGINS: ${DEV_CORS_ORIGINS:-http://localhost:5173}
      NETLIFY_SITE_SLUG: ${DEV_NETLIFY_SITE_SLUG:-}
      ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:-dev-admin-token}
      MAIL_PROVIDER: console
      # Passed to api-dev only, never to `api`: addresses @example.test sign in with this code.
      DEV_LOGIN_CODE: ${DEV_LOGIN_CODE:-}
      OVERPASS_URL: ${OVERPASS_URL:-http://overpass:80/api/interpreter}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      ENTITLEMENTS_ENFORCED: ${DEV_ENTITLEMENTS_ENFORCED:-true}
      OPENROUTER_API_KEY: ${DEV_OPENROUTER_API_KEY:-}
      PARSE_DAILY_BUDGET_CENTS: ${DEV_PARSE_DAILY_BUDGET_CENTS:-100}
      STRIPE_API_KEY: ${DEV_STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${DEV_STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${DEV_STRIPE_PRICE_ID:-}
      APP_URL: ${DEV_APP_URL:-http://localhost:5173}
      PHOTO_DIR: /data/photos
    # No host port: Caddy is the only thing that talks to it, as with `api`.

  # Self-hosted Overpass over a regional extract (plan section 8.6). Run
  # deploy/fetch-overpass-extract.sh first to populate ./overpass-db --
  # a $6/mo droplet's 1 GB RAM makes a clipped metro-area extract, not a
  # full state, the realistic ceiling for the import step. Not reachable
  # from outside the compose network; only the api service calls it.
  overpass:
    image: wiktorn/overpass-api
    restart: unless-stopped
    volumes:
      - ./overpass-db:/db
    environment:
      # OVERPASS_MODE defaults to "clone" (pull a full planet-scale binary
      # database from dev.overpass-api.de) if unset -- it silently ignores
      # OVERPASS_PLANET_URL in that mode. "init" is what actually builds
      # the database from the local extract below.
      OVERPASS_MODE: init
      OVERPASS_PLANET_URL: file:///db/region.osm.bz2
      OVERPASS_META: 'no'
      OVERPASS_RULES_LOAD: '10'

  # Reverse proxy + automatic HTTPS via Let's Encrypt. Needs a domain's A
  # record pointing at this droplet's IP first -- Let's Encrypt will not
  # issue a publicly-trusted certificate for a bare IP address. Edit
  # ./Caddyfile with your real domain before the first `docker compose up`.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
